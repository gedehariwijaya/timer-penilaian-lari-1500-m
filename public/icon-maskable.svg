<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Content scaled down to 78% and centered in safe zone -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Stopwatch top crown button -->
    <rect x="236" y="60" width="40" height="28" rx="8" fill="#ecfdf5" opacity="0.9" />
    <path d="M216 74 h80" stroke="#ecfdf5" stroke-width="8" stroke-linecap="round" />

    <!-- Outer Stopwatch Dial -->
    <circle cx="256" cy="276" r="150" fill="none" stroke="#ecfdf5" stroke-width="20" opacity="0.25" />
    <circle cx="256" cy="276" r="150" fill="none" stroke="#ffffff" stroke-width="20" stroke-dasharray="720" stroke-dashoffset="180" stroke-linecap="round" filter="url(#shadowMask)" />

    <!-- Inner Center -->
    <circle cx="256" cy="276" r="116" fill="#064e3b" opacity="0.4" />

    <!-- Runner Silhouette -->
    <g fill="#ffffff">
      <circle cx="292" cy="206" r="17" />
      <path d="M280 226 L242 268 L254 280 L288 242 Z" />
      <path d="M260 242 L288 264 L304 256 L278 234 Z" />
      <path d="M284 236 L320 248 L314 264 L276 248 Z" />
      <path d="M256 248 L232 234 L224 246 L246 262 Z" />
      <path d="M246 276 L276 314 L298 308 L262 268 Z" />
      <path d="M276 314 L308 350 L322 342 L288 306 Z" />
      <path d="M242 268 L206 302 L218 312 L254 278 Z" />
      <path d="M206 302 L172 312 L168 296 L204 288 Z" />
    </g>

    <!-- 1.5K Badge -->
    <g transform="translate(196, 338)">
      <rect x="0" y="0" width="120" height="38" rx="19" fill="url(#goldGradMask)" filter="url(#shadowMask)" />
      <text x="60" y="25" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">1.5 KM</text>
    </g>
  </g>
</svg>
