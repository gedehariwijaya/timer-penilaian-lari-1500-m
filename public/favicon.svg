<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Stopwatch top crown button -->
  <rect x="236" y="74" width="40" height="28" rx="8" fill="#ecfdf5" opacity="0.9" />
  <path d="M216 88 h80" stroke="#ecfdf5" stroke-width="8" stroke-linecap="round" />

  <!-- Outer Stopwatch Dial -->
  <circle cx="256" cy="286" r="148" fill="none" stroke="#ecfdf5" stroke-width="20" opacity="0.25" />
  <circle cx="256" cy="286" r="148" fill="none" stroke="#ffffff" stroke-width="20" stroke-dasharray="720" stroke-dashoffset="180" stroke-linecap="round" filter="url(#dropShadow)" />

  <!-- Inner Subtle Grid/Center -->
  <circle cx="256" cy="286" r="114" fill="#064e3b" opacity="0.4" />

  <!-- Dynamic Runner Silhouette (Moving Fast) -->
  <g fill="#ffffff">
    <!-- Head -->
    <circle cx="292" cy="216" r="17" />
    <!-- Torso / Body -->
    <path d="M280 236 L242 278 L254 290 L288 252 Z" />
    <path d="M260 252 L288 274 L304 266 L278 244 Z" />
    <!-- Front Arm -->
    <path d="M284 246 L320 258 L314 274 L276 258 Z" />
    <!-- Back Arm -->
    <path d="M256 258 L232 244 L224 256 L246 272 Z" />
    <!-- Front Leg (raised/bent) -->
    <path d="M246 286 L276 324 L298 318 L262 278 Z" />
    <path d="M276 324 L308 360 L322 352 L288 316 Z" />
    <!-- Back Leg (trailing) -->
    <path d="M242 278 L206 312 L218 322 L254 288 Z" />
    <path d="M206 312 L172 322 L168 306 L204 298 Z" />
  </g>

  <!-- 1.5K Golden Badge -->
  <g transform="translate(196, 348)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="url(#goldGrad)" filter="url(#dropShadow)" />
    <text x="60" y="25" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">1.5 KM</text>
  </g>
</svg>
